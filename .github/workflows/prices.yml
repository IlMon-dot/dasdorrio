# Цены площадок: scripts/prices.mjs берёт цены WB, Ozon и dasdorrio.ru в часы из prices-settings.json
# (расписание.часыМСК), бот коммитит prices.js и просит GitHub пересобрать сайт (push от GITHUB_TOKEN сборку сам не запускает).
# Cron будит скрипт каждый час: GitHub запускает по расписанию с опозданием, а когда пора собирать, решает сам скрипт.
# Репозиторий публичный — лог видят все, поэтому ключи Ozon только в Secrets, скрипт их не печатает.
name: Цены

on:
  schedule:
    - cron: '7 * * * *'    # каждый час в :07 UTC; вне расписания скрипт выходит без запросов и записи
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # вершина ветки на старте, а не коммит, с которым запуск встал в очередь concurrency: иначе ждавший запуск
      # не видит prices.js предыдущего, собирает тот же слот второй раз и падает на конфликте при push
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Собрать цены
        run: node scripts/prices.mjs
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}

      - name: Закоммитить prices.js
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prices.js
          if git diff --cached --quiet; then
            echo 'Цены не изменились'
            exit 0
          fi
          git commit -m 'Цены площадок'
          # редактор мог записать products.js за время запуска — подтягиваем и пробуем ещё
          for i in 1 2 3; do
            if git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo 'pushed=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo 'Не удалось отправить prices.js'
          exit 1

      - name: Запросить сборку Pages
        if: steps.commit.outputs.pushed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          curl -fsS -X POST
          -H "Authorization: Bearer $GH_TOKEN"
          -H "Accept: application/vnd.github+json"
          -H "X-GitHub-Api-Version: 2022-11-28"
          "https://api.github.com/repos/$GITHUB_REPOSITORY/pages/builds"
