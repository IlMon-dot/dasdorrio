# Цены площадок: scripts/prices.mjs берёт цены WB, Ozon и dasdorrio.ru в часы из prices-settings.json
# (расписание.часыМСК), бот коммитит prices.js, а сайт GitHub пересобирает сам: push бота тоже запускает сборку Pages.
# Cron будит скрипт каждый час, но GitHub исполняет расписание публичного репозитория как получится (4–6 запусков в сутки),
# поэтому час сбора сторожит сам скрипт: собирает в первом запуске после своего часа, а не в точный час.
# Репозиторий публичный — лог видят все, поэтому ключи Ozon и WB только в Secrets, скрипт их не печатает.
name: Цены

on:
  schedule:
    - cron: '7 * * * *'    # каждый час в :07 UTC; лишние запуски скрипт заканчивает за секунды без запросов и записи
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # вершина ветки на старте, а не коммит, с которым запуск встал в очередь concurrency: иначе ждавший запуск
      # не видит prices.js предыдущего, собирает тот же слот второй раз и падает на конфликте при push
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Собрать цены
        run: node scripts/prices.mjs
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
          WB_API_KEY: ${{ secrets.WB_API_KEY }}

      - name: Закоммитить prices.js
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prices.js
          if git diff --cached --quiet; then
            echo 'Цены не изменились'
            exit 0
          fi
          git commit -m 'Цены площадок'
          # редактор мог записать products.js за время запуска — подтягиваем и пробуем ещё
          for i in 1 2 3; do
            if git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo 'Не удалось отправить prices.js'
          exit 1
