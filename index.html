<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">

<script>
  /* Данные подключаются с меткой минуты: GitHub Pages кэширует файлы на 10 минут,
     а правки из редактора должны быть видны сразу. */
  document.write('<script src="products.js?v=' + Math.floor(Date.now() / 60000) + '"><\/script>');
</script>
<script>
  /* Яндекс.Метрика: после создания счётчика на metrika.yandex.ru вписать его номер вместо 0.
     Пока 0 — счётчик не подключается и страницу не замедляет. */
  var METRIKA_ID = 0;
</script>
<script>
  /* Красим страницу в палитру первого товара до первой отрисовки — без вспышки белого. */
  (function () {
    if (typeof ТОВАРЫ === 'undefined') return;
    var key = (location.hash || '').slice(1);
    var first = ТОВАРЫ.find(function (t) { return t.ключ === key; }) || ТОВАРЫ[0];
    var p = first.палитра, s = document.documentElement.style;
    s.setProperty('--bg', p.фон); s.setProperty('--bg2', p.фон2);
    s.setProperty('--accent', p.акцент); s.setProperty('--accent2', p.акцент2);
    s.setProperty('--fg', p.текст); s.setProperty('--fg2', p.текст2);
    var v = typeof ВЕРСИЯ_КАРТИНОК !== 'undefined' ? ВЕРСИЯ_КАРТИНОК : '1';
    [first.сцена, first.герой].forEach(function (src) {
      if (!src) return;
      var link = document.createElement('link');
      link.rel = 'preload'; link.as = 'image'; link.href = src + '?v=' + v;
      document.head.appendChild(link);
    });
  })();
</script>

<style>
  :root{
    /* Палитра сцены — подставляется из products.js */
    --bg:#1B2620; --bg2:#0F1915; --accent:#B8F53C; --accent2:#FFD400; --fg:#F4F8F2; --fg2:#A8BDB0;
    /* Цвета площадок — не меняются, это узнавание */
    --wb:#CB11AB; --ozon:#005BFF; --market:#FFCC00; --market-ink:#111111;
    /* Форма и ритм */
    --pill-h:52px; --thumb:60px; --rail-gap:10px; --rail-inset:8px; --rail-pad:12px;
    --gutter:20px;
    /* Кадр сцены: квадратная картинка, которая накрывает экран; центр и предел размера задаёт скрипт:
       герой не выше подиума, иначе в высоких окнах он налезает на название */
    --cover-size:min(100vw, var(--cover-max, 9999px)); --cover-cx:48%;
    --font-display:"Unbounded", "Arial Black", system-ui, sans-serif;
    --font-text:"Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --ease-out:cubic-bezier(.16,1,.3,1);
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%; background:var(--bg)}
  body{
    margin:0; min-height:100vh; min-height:100dvh;
    background:var(--bg); color:var(--fg);
    font-family:var(--font-text); font-size:16px; line-height:1.45;
    -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
    overflow-x:hidden;
  }
  ::selection{background:var(--accent); color:var(--bg)}
  :focus-visible{outline:3px solid var(--accent); outline-offset:3px; border-radius:999px}
  img{max-width:100%; height:auto; display:block}
  a{color:inherit}

  /* Сцена: одна цельная картинка мира товара. Товар вырезан из неё же и лежит ровно на своём месте,
     чтобы его можно было анимировать; под ним фон дорисован. */
  .scene{
    position:relative; min-height:100vh; min-height:100dvh; overflow:hidden;
    background:var(--bg);
  }
  .cover{position:absolute; inset:0; z-index:0; overflow:hidden}
  .layer{position:absolute; inset:0; opacity:0}
  .layer .blur{
    position:absolute; inset:-8%;
    background-size:cover; background-position:center;
    filter:blur(30px) brightness(.86); transform:translateZ(0);
  }
  .layer .frame{
    position:absolute; left:var(--cover-cx); top:var(--cover-cy, 50%);
    width:var(--cover-size); height:var(--cover-size);
    transform:translate(-50%,-50%);
  }
  .layer .frame img.bg{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
  /* на телефоне кадр уже экрана по высоте: верх и низ мягко уходят в размытую заливку */
  .layer .frame{
    -webkit-mask-image:linear-gradient(to bottom, transparent, #000 5%, #000 95%, transparent);
    mask-image:linear-gradient(to bottom, transparent, #000 5%, #000 95%, transparent);
  }
  .layer .frame img.hero{
    position:absolute; left:var(--hx); top:var(--hy); width:var(--hw); height:auto;
    will-change:transform;
  }
  .layer .frame .shadow{
    position:absolute; left:var(--sx); top:var(--sy); width:var(--sw); height:var(--sh);
    background:radial-gradient(50% 50% at 50% 50%, rgba(0,0,0,.35), rgba(0,0,0,0) 72%);
    transform-origin:center; pointer-events:none;
  }
  /* Передний кадр повторяет геометрию фона, но без маски: герой не тускнеет у краёв */
  .layer .frame.fg{-webkit-mask-image:none; mask-image:none}
  /* Вуаль — затемнение в тоне палитры: внизу под текст, вверху под логотип. Лежит МЕЖДУ фоном и героем,
     поэтому товар остаётся ярким, а пол вокруг него уходит в тень — насос не сливается с фоном */
  .layer .veil{
    position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(to top, var(--bg) 0%, var(--bg) 4%, rgba(0,0,0,0) 58%);
  }
  @supports (background: color-mix(in srgb, red 50%, transparent)){
    .layer .veil{
      background:
        linear-gradient(to top, var(--bg) 0%, color-mix(in srgb, var(--bg) 94%, transparent) 10%, color-mix(in srgb, var(--bg) 75%, transparent) 24%, color-mix(in srgb, var(--bg) 42%, transparent) 40%, rgba(0,0,0,0) 56%),
        linear-gradient(to bottom, color-mix(in srgb, var(--bg) 42%, transparent) 0%, rgba(0,0,0,0) 20%);
    }
  }

  .top{
    position:absolute; inset:0 auto auto 0; z-index:5;
    padding:calc(14px + env(safe-area-inset-top)) var(--gutter) 0;
  }
  .logo{display:inline-block; line-height:0}
  .logo img{width:118px; height:auto}

  .stage{
    min-height:100vh; min-height:100dvh;
    position:relative; z-index:2;
    display:grid; grid-template-rows:1fr auto;
    padding:calc(72px + env(safe-area-inset-top)) var(--gutter) calc(20px + env(safe-area-inset-bottom));
  }
  /* Подиум пустой: это место в кадре, где стоит товар; по его центру выставляется кадр и лента */
  .podium{
    position:relative; min-height:280px;
    margin-right:calc(var(--thumb) + var(--rail-inset) + 12px);
  }

  .copy{padding-top:14px}
  h1{
    font-family:var(--font-display); font-weight:800;
    font-size:clamp(23px, 6.4vw, 34px); line-height:1.06; letter-spacing:-0.02em;
    margin:0; text-wrap:balance; hyphens:manual; overflow-wrap:normal;
    text-shadow:0 2px 18px rgba(0,0,0,.18);
  }

  .pills{display:flex; flex-wrap:wrap; gap:10px; margin-top:16px}
  /* Таблетки полупрозрачные, в тоне сцены: на тёмной сцене затемняют, на светлой — осветляют.
     Площадку узнаём по цветной монетке слева. */
  .pill{
    display:inline-flex; align-items:center; gap:10px;
    height:var(--pill-h); padding:0 20px 0 14px; border-radius:999px;
    font-weight:500; font-size:16px; text-decoration:none; white-space:nowrap;
    color:var(--fg); background:var(--pill-bg, rgba(0,0,0,.26));
    border:1px solid var(--pill-line, rgba(255,255,255,.18));
    box-shadow:0 6px 14px -10px rgba(0,0,0,.4);
    -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
    transition:transform .22s var(--ease-out), background-color .22s var(--ease-out), border-color .22s var(--ease-out);
    will-change:transform;
  }
  .pill .coin{
    width:12px; height:12px; border-radius:50%; flex:none; background:var(--c);
    box-shadow:0 0 0 2px var(--pill-line, rgba(255,255,255,.18));
  }
  .pill--wb{--c:var(--wb)}
  .pill--ozon{--c:var(--ozon)}
  .pill--market{--c:var(--market)}
  .pill--shop{--c:var(--accent)}
  .pill--other{--c:var(--accent2)}
  @media (hover:hover){
    .pill:hover{transform:translateY(-3px); background:var(--pill-bg-hover, rgba(0,0,0,.4)); border-color:var(--pill-line-hover, rgba(255,255,255,.3))}
  }
  .pill:active{transform:translateY(1px) scale(.97); background:var(--pill-bg-hover, rgba(0,0,0,.4))}
  .pill.tw{transition:none}   /* пока таблетку ведёт GSAP, CSS-переход выключен */

  /* Лента выбора: справа, под большой палец */
  .rail{
    position:absolute; z-index:6;
    right:max(calc(var(--rail-inset) - var(--rail-pad)), env(safe-area-inset-right));
    top:var(--rail-top, 50%); transform:translateY(-50%);
    transition:top .4s var(--ease-out);
    display:flex; flex-direction:column; gap:var(--rail-gap);
    max-height:calc(100dvh - 150px); overflow-y:auto; overscroll-behavior:contain;
    /* поля ленты шире кольца активного кругляшка (масштаб 1,14 + кольцо 6 px), иначе прокрутка его режет */
    padding:var(--rail-pad); scrollbar-width:none; scroll-snap-type:y proximity;
  }
  .rail::-webkit-scrollbar{display:none}
  .rail button{
    width:var(--thumb); height:var(--thumb); flex:none; scroll-snap-align:center;
    border:0; padding:0; border-radius:50%; cursor:pointer;
    background:var(--c); background:color-mix(in srgb, var(--c) 78%, #fff); display:grid; place-items:center;
    box-shadow:0 4px 10px -4px rgba(0,0,0,.5), inset 0 0 0 2px rgba(255,255,255,.18);
    transition:transform .25s var(--ease-out), box-shadow .25s var(--ease-out);
    -webkit-tap-highlight-color:transparent;
  }
  .rail button img{width:100%; height:100%; border-radius:50%; object-fit:cover; pointer-events:none}
  .rail button[aria-current="true"]{
    transform:scale(1.14);
    box-shadow:0 0 0 3px var(--bg), 0 0 0 6px var(--fg), 0 8px 16px -6px rgba(0,0,0,.6);
  }
  .rail button:focus-visible{outline-offset:4px}

  /* Низкие экраны: миниатюры компактнее, чтобы лента умещалась над текстом */
  @media (max-height:700px) and (max-width:899px){
    :root{--thumb:50px; --rail-gap:8px}
  }

  /* Десктоп: постер — картинка во всю ширину, название и таблетки внизу слева, лента справа */
  @media (min-width:900px){
    :root{--thumb:76px; --rail-gap:14px; --rail-inset:26px; --gutter:56px; --cover-size:min(112dvh, 100vw, var(--cover-max, 9999px)); --cover-cx:60%}
    .logo img{width:168px}
    .top{padding-top:26px}
    .layer .frame{
      -webkit-mask-image:linear-gradient(to right, transparent, #000 10%, #000 90%, transparent);
      mask-image:linear-gradient(to right, transparent, #000 10%, #000 90%, transparent);
    }
    .stage{
      padding:100px calc(var(--thumb) + var(--rail-inset) + 44px) 44px var(--gutter);
      min-height:100dvh;
    }
    .podium{min-height:min(38vh, 400px); margin-right:0}
    .copy{padding-top:0; max-width:540px}
    h1{font-size:clamp(30px, 3vw, 46px)}
    .pills{margin-top:28px; gap:12px}
    .pill{height:56px; padding:0 24px 0 22px; font-size:17px}
  }
  @media (min-width:1600px){
    h1{font-size:58px}
  }

  @media (prefers-reduced-motion:reduce){
    .pill, .rail button{transition:none}
  }
</style>
</head>
<body>
<div class="scene" id="scene">
  <div class="cover" id="cover" aria-hidden="true"></div>
  <header class="top">
    <a class="logo" href="#" id="logo-link" aria-label="Dasdorrio — в начало">
      <img id="logo" src="logo/dasdorrio-light.webp" width="340" height="171" alt="Dasdorrio">
    </a>
  </header>

  <main class="stage">
    <div class="podium" id="podium"></div>
    <div class="copy" id="copy">
      <h1 id="title"></h1>
      <nav class="pills" id="pills" aria-label="Где купить"></nav>
    </div>
  </main>

  <nav class="rail" id="rail" aria-label="Выбор товара"></nav>
  <noscript><p style="padding:20px">Для выбора товара нужен JavaScript. Все товары есть на Wildberries и Ozon по запросу «Dasdorrio».</p></noscript>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(function () {
  'use strict';
  var items = ТОВАРЫ;
  var root = document.documentElement;
  var cover = document.getElementById('cover');
  var podium = document.getElementById('podium');
  var scene = document.getElementById('scene');
  var titleEl = document.getElementById('title');
  var pillsEl = document.getElementById('pills');
  var rail = document.getElementById('rail');
  var logo = document.getElementById('logo');
  var themeMeta = document.querySelector('meta[name="theme-color"]');
  var current = -1, tl = null, floaters = [], gen = 0;
  var hasGsap = typeof gsap !== 'undefined';
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* Монетка таблетки — по виду ссылки; подпись и адрес берутся из products.js */
  var KIND = { wb: 'pill--wb', ozon: 'pill--ozon', market: 'pill--market', shop: 'pill--shop' };
  var COIN = '<span class="coin" aria-hidden="true"></span>';

  /* Картинки с меткой версии из products.js: после замены файлов браузер не покажет старые */
  var IMG_V = typeof ВЕРСИЯ_КАРТИНОК !== 'undefined' ? ВЕРСИЯ_КАРТИНОК : '1';
  function pic(u) { return u ? u + '?v=' + IMG_V : u; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  /* Лента миниатюр */
  items.forEach(function (t, i) {
    var b = document.createElement('button');
    b.type = 'button';
    b.style.setProperty('--c', t.палитра.фон);
    b.setAttribute('aria-label', t.название);
    b.innerHTML = '<img src="' + esc(pic(t.миниатюра)) + '" alt="" width="200" height="200">';
    b.addEventListener('click', function () { show(i, true); });
    rail.appendChild(b);
  });
  rail.addEventListener('keydown', function (e) {
    if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
    e.preventDefault();
    var next = (current + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
    show(next, true);
    rail.children[next].focus();
  });

  function setPalette(p, animate) {
    var vars = { '--bg': p.фон, '--bg2': p.фон2, '--accent': p.акцент, '--accent2': p.акцент2, '--fg': p.текст, '--fg2': p.текст2 };
    if (hasGsap && animate && !reduce) {
      gsap.to(root, Object.assign({ duration: .6, ease: 'power2.inOut' }, vars));
    } else {
      Object.keys(vars).forEach(function (k) { root.style.setProperty(k, vars[k]); });
    }
    themeMeta.setAttribute('content', p.фон);
    var light = p.логотип === 'тёмный';            // светлая сцена -> тёмный логотип и тёмный текст
    root.style.setProperty('--pill-bg', light ? 'rgba(255,255,255,.34)' : 'rgba(0,0,0,.26)');
    root.style.setProperty('--pill-bg-hover', light ? 'rgba(255,255,255,.5)' : 'rgba(0,0,0,.4)');
    root.style.setProperty('--pill-line', light ? 'rgba(255,255,255,.55)' : 'rgba(255,255,255,.2)');
    root.style.setProperty('--pill-line-hover', light ? 'rgba(255,255,255,.8)' : 'rgba(255,255,255,.34)');
    logo.src = light ? 'logo/dasdorrio.webp' : 'logo/dasdorrio-light.webp';
  }

  function buildPills(t) {
    var html = '';
    (t.ссылки || []).forEach(function (l) {
      if (!l || !l.адрес) return;
      var kind = KIND[l.вид] ? l.вид : 'other';
      html += '<a class="pill ' + (KIND[kind] || 'pill--other') + '" href="' + esc(l.адрес) + '" rel="noopener" data-place="' + kind + '" data-product="' + esc(t.ключ) + '">' +
              COIN + '<span>' + esc(l.имя || l.адрес) + '</span></a>';
    });
    pillsEl.innerHTML = html;
  }

  function preload(src) {
    return new Promise(function (res) {
      if (!src) { res(null); return; }
      var im = new Image();
      im.onload = im.onerror = function () { res(im); };
      im.src = src;
      if (im.decode) { im.decode().then(function () { res(im); }, function () { res(im); }); }
    });
  }

  /* Слой сцены: размытая заливка + кадр с фоном + вуаль + передний кадр с тенью и героем на своём месте */
  function buildLayer(t, g) {
    var box = t.геройБокс || [0.3, 0.3, 0.4, 0.4];
    var layer = document.createElement('div');
    layer.className = 'layer'; layer.dataset.gen = g;
    var blur = document.createElement('div'); blur.className = 'blur';
    if (t.сцена) blur.style.backgroundImage = 'url("' + pic(t.сцена) + '")';
    var frame = document.createElement('div'); frame.className = 'frame';
    if (t.сцена) {
      var bg = document.createElement('img'); bg.className = 'bg'; bg.src = pic(t.сцена); bg.alt = '';
      frame.appendChild(bg);
    }
    var veil = document.createElement('div'); veil.className = 'veil';
    var fg = document.createElement('div'); fg.className = 'frame fg';
    var shadow = document.createElement('div'); shadow.className = 'shadow';
    shadow.style.setProperty('--sx', (box[0] + box[2] * 0.08) * 100 + '%');
    shadow.style.setProperty('--sw', box[2] * 0.84 * 100 + '%');
    shadow.style.setProperty('--sy', (box[1] + box[3] * 0.93) * 100 + '%');
    shadow.style.setProperty('--sh', box[3] * 0.12 * 100 + '%');
    fg.appendChild(shadow);
    var hero = document.createElement('img'); hero.className = 'hero';
    hero.src = pic(t.герой); hero.alt = t.название; hero.setAttribute('fetchpriority', 'high');
    hero.style.setProperty('--hx', box[0] * 100 + '%');
    hero.style.setProperty('--hy', box[1] * 100 + '%');
    hero.style.setProperty('--hw', box[2] * 100 + '%');
    fg.appendChild(hero);
    layer.appendChild(blur); layer.appendChild(frame); layer.appendChild(veil); layer.appendChild(fg);
    return { layer: layer, frame: frame, hero: hero, shadow: shadow };
  }

  /* Кадр выставляется так, чтобы центр товара совпал с центром подиума */
  function placeCover(t) {
    var box = t.геройБокс || [0.3, 0.3, 0.4, 0.4];
    var sceneTop = scene.getBoundingClientRect().top;
    var r = podium.getBoundingClientRect();
    var podiumCy = r.top - sceneTop + r.height / 2;
    var desktop = window.matchMedia('(min-width:900px)').matches;
    /* герой не выше 92 % подиума и не шире полосы от левого поля до ленты кружков */
    var railLeft = rail.getBoundingClientRect().left + 12;                 // 12 px — поле ленты, дальше кружки
    var gutter = desktop ? (parseFloat(getComputedStyle(root).getPropertyValue('--gutter')) || 56) : 0;
    var maxH = r.height * 0.92 / box[3];
    var maxW = (railLeft - 10 - gutter) / box[2];
    root.style.setProperty('--cover-max', Math.round(Math.min(maxH, maxW)) + 'px');
    var frame = cover.querySelector('.frame');
    var size = frame ? frame.offsetHeight : Math.max(window.innerWidth, window.innerHeight);
    var pc = box[1] + box[3] / 2;
    var cy = podiumCy - (pc - 0.5) * size;
    root.style.setProperty('--cover-cy', Math.round(cy) + 'px');
    /* по горизонтали: правый край героя не заходит под ленту */
    var cx = window.innerWidth * (desktop ? 0.6 : 0.48);
    var heroRight = cx - size / 2 + (box[0] + box[2]) * size;
    cx -= Math.max(0, heroRight - (railLeft - 10));
    root.style.setProperty('--cover-cx', Math.round(cx) + 'px');
  }
  function placeRail() {
    var sceneTop = scene.getBoundingClientRect().top;
    var r = podium.getBoundingClientRect();
    rail.style.setProperty('--rail-top', Math.round(r.top - sceneTop + r.height / 2) + 'px');
  }
  function relayout() { if (current >= 0) placeCover(items[current]); placeRail(); }
  window.addEventListener('resize', relayout);
  if (window.ResizeObserver) { new ResizeObserver(relayout).observe(podium); }
  if (document.fonts && document.fonts.ready) { document.fonts.ready.then(relayout); }

  /* Убирает слои чужих поколений: защита от быстрых тапов, когда таймлайн убит до onComplete */
  function sweep(keepGen, instant) {
    Array.prototype.slice.call(cover.children).forEach(function (el) {
      var g = +el.dataset.gen || 0;
      if (g === keepGen) return;
      if (instant || g < keepGen - 1) el.remove();
    });
  }
  function killFloat() { floaters.forEach(function (f) { f.kill(); }); floaters = []; }
  /* Твины таблеток: на время твина класс tw (без CSS-перехода), в конце встроенные стили снимаются,
     иначе transform из GSAP перебивает :hover и таблетка остаётся поднятой */
  function pillTween(pills) {
    pills.forEach(function (p) { p.classList.add('tw'); });
    return { onComplete: function () { pills.forEach(function (p) { p.classList.remove('tw'); }); }, clearProps: 'transform,opacity' };
  }
  /* Покой: товар мягко подпрыгивает над своим местом, тень под ним сжимается */
  function startFloat(hero, shadow) {
    if (!hasGsap || reduce) return;
    var bounce = gsap.timeline({ repeat: -1, repeatDelay: 1.6 });
    bounce.to(hero, { y: -14, duration: .42, ease: 'power2.out' })
          .to(shadow, { scale: .86, opacity: .7, duration: .42, ease: 'power2.out' }, 0)
          .to(hero, { y: 0, duration: .5, ease: 'bounce.out' })
          .to(shadow, { scale: 1, opacity: 1, duration: .3, ease: 'power2.in' }, '-=.5');
    floaters.push(bounce);
  }

  function show(i, animate) {
    if (i === current) return;
    var t = items[i];
    var dir = i > current ? 1 : -1;
    gen += 1;
    var myGen = gen;
    sweep(myGen);
    current = i;

    Array.prototype.forEach.call(rail.children, function (b, k) {
      if (k === i) { b.setAttribute('aria-current', 'true'); b.scrollIntoView({ block: 'nearest', behavior: animate ? 'smooth' : 'auto' }); }
      else b.removeAttribute('aria-current');
    });
    try { history.replaceState(null, '', '#' + t.ключ); } catch (e) { /* file:// не даёт менять адрес — не страшно */ }
    if (current >= 0 && animate) track.view(t);

    setPalette(t.палитра, animate);

    Promise.all([preload(pic(t.герой)), preload(pic(t.сцена))]).then(function () {
      if (current !== i) return;               // успели нажать другое — этот кадр пропускаем
      if (tl) tl.kill();
      killFloat();

      var old = Array.prototype.slice.call(cover.children);
      var L = buildLayer(t, myGen);
      cover.appendChild(L.layer);
      placeCover(t);
      setTimeout(function () { if (gen === myGen) sweep(myGen, true); }, 1200);

      titleEl.textContent = t.название;
      buildPills(t);
      placeRail();
      var pills = Array.prototype.slice.call(pillsEl.children);
      var copyBits = [titleEl];
      var removeOld = function () { old.forEach(function (d) { d.remove(); }); };

      if (!hasGsap || !animate) {
        removeOld();
        L.layer.style.opacity = 1;
        if (hasGsap && !reduce) {
          gsap.from(L.hero, { y: 36, opacity: 0, scale: .96, duration: .8, ease: 'power3.out' });
          gsap.from(copyBits, { y: 16, opacity: 0, duration: .5, ease: 'power2.out', stagger: .06, delay: .1 });
          gsap.from(pills, Object.assign({ y: 14, opacity: 0, duration: .45, ease: 'back.out(1.6)', stagger: .05, delay: .25 }, pillTween(pills)));
        }
        startFloat(L.hero, L.shadow);
        return;
      }

      if (reduce) {
        tl = gsap.timeline();
        tl.to(L.layer, { opacity: 1, duration: .4 }, 0);
        if (old.length) tl.to(old, { opacity: 0, duration: .4, onComplete: removeOld }, 0);
        tl.from(copyBits.concat(pills), { opacity: 0, duration: .35, clearProps: 'opacity' }, .1);
        return;
      }

      tl = gsap.timeline({ defaults: { overwrite: 'auto' } });
      /* новая сцена проявляется поверх старой, товар приподнимается на место, текст и таблетки поднимаются */
      tl.to(L.layer, { opacity: 1, duration: .75, ease: 'power2.out' }, 0)
        .fromTo(L.hero, { y: 48 * dir, opacity: 0, scale: .94 }, { y: 0, opacity: 1, scale: 1, duration: .7, ease: 'power3.out' }, .12)
        .fromTo(L.shadow, { scale: .7, opacity: 0 }, { scale: 1, opacity: 1, duration: .6, ease: 'power2.out' }, .2)
        .to(copyBits, { y: -10, opacity: 0, duration: .22, ease: 'power2.in' }, 0)
        .fromTo(copyBits, { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: .45, ease: 'power2.out', stagger: .06 }, .3)
        .fromTo(pills, { y: 16, opacity: 0, scale: .96 }, Object.assign({ y: 0, opacity: 1, scale: 1, duration: .45, ease: 'back.out(1.6)', stagger: .05 }, pillTween(pills)), .38)
        .add(function () { removeOld(); startFloat(L.hero, L.shadow); }, .8);
      if (old.length) tl.to(old, { opacity: 0, duration: .5, ease: 'power2.in' }, .3);
    });
  }

  /* Таблетка пружинит под пальцем; подъём при наведении — обычный CSS :hover */
  if (hasGsap && !reduce) {
    pillsEl.addEventListener('pointerdown', function (e) {
      var pill = e.target.closest('.pill'); if (!pill) return;
      var lift = e.pointerType === 'mouse' ? -3 : 0;
      gsap.fromTo(pill, { scale: .94, y: lift }, Object.assign({ scale: 1, y: lift, duration: .5, ease: 'elastic.out(1, .45)' }, pillTween([pill])));
    });
  }

  /* Аналитика: заходы + клики по таблеткам с товаром и площадкой */
  var track = { view: function () {}, click: function () {} };
  if (window.METRIKA_ID) {
    (function (m, e, t, r, i, k, a) { m[i] = m[i] || function () { (m[i].a = m[i].a || []).push(arguments); }; m[i].l = 1 * new Date();
      k = e.createElement(t); a = e.getElementsByTagName(t)[0]; k.async = 1; k.src = r; a.parentNode.insertBefore(k, a); })(window, document, 'script', 'https://mc.yandex.ru/metrika/tag.js', 'ym');
    ym(METRIKA_ID, 'init', { clickmap: false, trackLinks: true, accurateTrackBounce: true, webvisor: false, trackHash: true });
    track.view = function (t) { ym(METRIKA_ID, 'hit', location.href, { title: t.название, params: { товар: t.ключ } }); };
    track.click = function (product, place) {
      var p = { товар: product, площадка: place };
      ym(METRIKA_ID, 'reachGoal', 'marketplace_click', p);   // общая цель: любой уход на площадку
      ym(METRIKA_ID, 'reachGoal', 'click_' + place, p);       // цель по площадке: click_wb / click_ozon / click_shop
      ym(METRIKA_ID, 'params', { клик: p });                  // параметры визита: какой товар кликают чаще
    };
  }
  pillsEl.addEventListener('click', function (e) {
    var pill = e.target.closest('.pill'); if (!pill) return;
    track.click(pill.dataset.product, pill.dataset.place);
  });

  document.getElementById('logo-link').addEventListener('click', function (e) { e.preventDefault(); show(0, true); });
  window.addEventListener('hashchange', function () {
    var k = location.hash.slice(1), idx = items.findIndex(function (t) { return t.ключ === k; });
    if (idx >= 0 && idx !== current) show(idx, true);
  });

  /* GitHub Pages отдаёт страницу из кэша до 10 минут: если на сервере она новее — перезагрузить один раз */
  try {
    fetch(location.pathname, { method: 'HEAD', cache: 'no-store' }).then(function (r) {
      var srv = Date.parse(r.headers.get('last-modified') || ''), mine = Date.parse(document.lastModified);
      if (srv && mine && srv - mine > 60000 && !sessionStorage.getItem('reload-' + srv)) {
        sessionStorage.setItem('reload-' + srv, '1'); location.reload();
      }
    }).catch(function () {});
  } catch (e) { /* file:// */ }

  var startKey = location.hash.slice(1);
  var startIdx = items.findIndex(function (t) { return t.ключ === startKey; });
  show(startIdx >= 0 ? startIdx : 0, false);
})();
</script>
</body>
